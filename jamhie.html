    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            /* Prevent scrolling completely */
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fce7f3 0%, #f3e8ff 50%, #e0f2fe 100%);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border-radius: 2rem;
            max-width: 500px;
            width: 90%;
            padding: 3rem;
            text-align: center;
            transition: all 0.5s ease;
        }

        .title-text {
            font-family: 'Dancing Script', cursive;
            color: #db2777;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
        }

        #quote-container {
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .quote-text {
            font-size: 1.25rem;
            color: #4b5563;
            line-height: 1.6;
            font-weight: 500;
            opacity: 1;
            transition: opacity 0.4s ease;
        }

        .author-text {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #9ca3af;
            font-style: italic;
        }

        .btn-inspire {
            margin-top: 2rem;
            background: #db2777;
            color: white;
            padding: 0.75rem 2rem;
            border-radius: 9999px;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 15px rgba(219, 39, 119, 0.3);
        }

        .btn-inspire:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(219, 39, 119, 0.4);
            background: #be185d;
        }

        .btn-inspire:active {
            transform: translateY(0);
        }

        .fade-out {
            opacity: 0;
        }

        /* Decorative Floating Circles */
        .circle {
            position: absolute;
            border-radius: 50%;
            z-index: -1;
            filter: blur(40px);
            animation: float 10s infinite alternate ease-in-out;
        }

        @keyframes float {
            from { transform: translate(0, 0); }
            to { transform: translate(20px, 40px); }
        }
    </style>
</head>

    <!-- Background Decoration -->

        function generateQuote() {
            const quoteEl = document.getElementById('quote');
            const authorEl = document.getElementById('author');
            quoteEl.classList.add('fade-out');
            authorEl.classList.add('fade-out');
            setTimeout(() => {
                const pick = quotes[Math.floor(Math.random() * quotes.length)];
                quoteEl.textContent = `"${pick.text}"`;
                authorEl.textContent = `— ${pick.author}`;
                quoteEl.classList.remove('fade-out');
                authorEl.classList.remove('fade-out');
            }, 400);
        }

        window.onload = generateQuote;
